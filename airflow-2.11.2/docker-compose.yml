x-airflow-common: &airflow-common
  image: airflow-upgrade-2.11.2:wolfi-py312
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - ../.env
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN:-postgresql+psycopg2://postgres:Rampoo%401981@postgres:5432/airflow}
    AIRFLOW__CORE__SQL_ALCHEMY_CONN: ${AIRFLOW__CORE__SQL_ALCHEMY_CONN:-postgresql+psycopg2://postgres:Rampoo%401981@postgres:5432/airflow}
    AIRFLOW__CORE__FERNET_KEY: dGVzdC1mZXJuZXQta2V5LWZvci1sb2NhbC1kZXYtMzJieXRlcw==
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    _AIRFLOW_WWW_USER_USERNAME: admin
    _AIRFLOW_WWW_USER_PASSWORD: admin
    AIRFLOW_UID: ${AIRFLOW_UID:-50000}
    AIRFLOW_VERSION_LABEL: "2.11.2-wolfi-py312"
    UPGRADE_STAGE: "2"
    POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
    POSTGRES_PORT: ${POSTGRES_PORT:-5432}
    POSTGRES_USER: ${POSTGRES_USER:-postgres}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Rampoo@1981}
    DEST_DB: ${DEST_DB:-airflow}
    SOURCE_FILE: ${SOURCE_FILE:-/data/orders.csv}
  volumes:
    - ./dags:/opt/airflow/dags
    - ../shared/dags:/opt/airflow/dags/shared
    - ../data-migration/data:/data:ro
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./config:/opt/airflow/config
  user: "50000:0"
  entrypoint: ["airflow"]
  networks:
    - airflow-upgrade

services:
  airflow-init:
    <<: *airflow-common
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        airflow db migrate
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com || true
        echo "Airflow 2.11.2 (Wolfi/Python 3.12) DB migrated"
    environment:
      <<: *airflow-common-env

  airflow-webserver:
    <<: *airflow-common
    command: ["webserver"]
    ports:
      - "18080:8080"
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: ["scheduler"]
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

networks:
  airflow-upgrade:
    name: airflow-upgrade-net
    external: true
